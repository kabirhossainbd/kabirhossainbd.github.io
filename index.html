  <style>
    body {
      background-color: #080D19;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(22, 119, 255, 0.16) 0%, rgba(155, 114, 255, 0.08) 34%, #080D19 72%);
      z-index: 99999;
      transition: opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1), transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    #loading-container.hidden {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUpIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-box {
      padding: 14px 26px;
      border-radius: 22px;
      background: rgba(14, 22, 41, 0.88);
      border: 1.5px solid rgba(22, 119, 255, 0.38);
      box-shadow: 0 0 28px rgba(22, 119, 255, 0.24), 4px 4px 24px rgba(155, 114, 255, 0.14);
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #F8FAFC;
      letter-spacing: 0.8px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
    }

    .logo-box span {
      color: #1677FF;
    }


      .progress-track {
        width: 156px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
        position: relative;
      }

      .progress-bar {
        position: absolute;
        top: 0;
        left: -45%;
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #1677FF, #9B72FF);
        animation: indeterminateSlide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .loading-subtext {
        margin-top: 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        color: #94A3B8;
        letter-spacing: 1.8px;
        text-transform: uppercase;
      }

        @keyframes fadeUpIn {
          from {
            opacity: 0;
            transform: translateY(10px) scale(0.96);
          }

          to {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }

        @keyframes indeterminateSlide {
          0% {
            left: -45%;
          }

          100% {
            left: 105%;
          }
        }
  </style>
</head>

<body>
  <div id="loading-container">
    <div class="loader-card">
      <div class="logo-box">Kabir<span>.dev</span></div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="loading-subtext">Mobile Architect &bull; Flutter</div>
    </div>
  </div>
  <script>
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('700 1em Sora'),
        document.fonts.load('400 1em Inter'),
        document.fonts.load('600 1em "JetBrains Mono"')
      ]).catch(function () {});
    }
    var loaderHidden = false;
    function hideLoader() {
      if (loaderHidden) return;
      loaderHidden = true;
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () {
          loader.style.display = 'none';
        }, 200);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    setTimeout(hideLoader, 8000);
  </script>
