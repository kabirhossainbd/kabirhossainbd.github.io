<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Md. Kabir Hossain - Mobile Architect & Senior Flutter Engineer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kabir's Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Md. Kabir Hossain | Mobile Architect & Senior Flutter Engineer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0F19;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #111827 0%, #0B0F19 100%);
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    }
    .logo-box {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 1px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
    }
    .logo-box span {
      color: #00D2FF;
    }
    .spinner-ring {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #00D2FF;
      border-right: 3px solid #A855F7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-subtext {
      margin-top: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #94A3B8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-box">Kabir<span>.dev</span></div>
    <div class="spinner-ring"></div>
    <div class="loading-subtext">Loading Portfolio...</div>
  <script>
    function hideLoader() {
      var loader = document.getElementById('loading-container');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 500);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoader);
    window.addEventListener('load', function() {
      setTimeout(hideLoader, 1000);
    });
    setTimeout(hideLoader, 2500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
